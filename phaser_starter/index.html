<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG Game - Phaser Starter</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            background: #1a1a1a;
            overflow: hidden;
            /* Prevent scrollbars */
        }

        #game-container {
            width: 100%;
            height: 100%;
            /* Removed border/shadow for full immersion, or keep if desired but strictly inside */
        }

        #game-container canvas {
            display: block;
        }

</head>
